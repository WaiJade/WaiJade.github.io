<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" fill="none">
  <defs>
    <clipPath id="avatar-mask">
      <rect x="20" y="20" width="216" height="216" rx="56" />
    </clipPath>
  </defs>
  <rect width="256" height="256" rx="64" fill="#050816" />
  <image
    href="/avatar.png"
    x="20"
    y="20"
    width="216"
    height="216"
    preserveAspectRatio="xMidYMid slice"
    clip-path="url(#avatar-mask)"
  />
</svg>
