<!doctype html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#050816" />
    <title>WaiJade's BLOG / OFFLINE</title>
    <script>
      if (navigator.onLine) {
        window.location.replace("/offline/");
      }
    </script>
    <style>
      @font-face {
        font-family: "NSourceSong";
        src: url("/fonts/NSourceSong_Headline.woff2") format("woff2");
        font-display: swap;
      }

      :root {
        color-scheme: dark;
        --background: #050816;
        --foreground: #f5f7ff;
        --muted: rgba(245, 247, 255, 0.68);
        --border: rgba(255, 255, 255, 0.12);
        --accent: #8fa7ff;
        --grid-line: rgba(255, 255, 255, 0.08);
        --font-family-sans:
          "MiSans", "MiSans Chinese", MiSans, "Inter", "SF Pro Display",
          "Segoe UI", sans-serif;
        --font-family-display: "NSourceSong", serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        color: var(--foreground);
        background: var(--background);
        font-family: var(--font-family-sans);
      }

      a,
      button {
        color: inherit;
        font: inherit;
      }

      .page-shell {
        position: relative;
        min-height: 100vh;
        overflow: clip;
      }

      .page__bg,
      .hero__grid,
      .hero__glow,
      .hero__vignette {
        position: fixed;
        inset: 0;
        pointer-events: none;
      }

      .hero__grid {
        background-image:
          linear-gradient(to right, var(--grid-line) 1px, transparent 1px),
          linear-gradient(to bottom, var(--grid-line) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.38;
      }

      .hero__glow::before,
      .hero__glow::after {
        content: "";
        position: absolute;
        inset: 0;
      }

      .hero__glow::before {
        background:
          radial-gradient(70% 45% at 50% 100%, rgba(145, 165, 255, 0.28), transparent 70%),
          radial-gradient(45% 30% at 50% 8%, rgba(70, 95, 188, 0.16), transparent 72%);
      }

      .hero__glow::after {
        background: linear-gradient(
          to top,
          rgba(2, 4, 10, 0.92),
          rgba(2, 4, 10, 0.18) 55%,
          rgba(2, 4, 10, 0.86)
        );
      }

      .site-main {
        position: relative;
        z-index: 1;
        min-height: 100vh;
      }

      .error-404 {
        position: relative;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding:
          clamp(7rem, 12vh, 8.5rem) clamp(1.25rem, 4vw, 2rem)
          clamp(3rem, 8vh, 5rem);
        overflow: clip;
      }

      .error-404__glow {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .error-404__glow::before {
        content: "";
        position: absolute;
        top: clamp(-12rem, -10vw, -4rem);
        left: 50%;
        width: min(88rem, 130vw);
        height: min(38rem, 62vw);
        transform: translateX(-50%);
        background:
          radial-gradient(
            50% 56% at 50% 34%,
            rgba(255, 255, 255, 0.24) 0%,
            rgba(255, 255, 255, 0.12) 34%,
            rgba(255, 255, 255, 0.04) 54%,
            transparent 78%
          );
        filter: blur(24px);
        opacity: 0.9;
      }

      .error-404__content {
        position: relative;
        z-index: 1;
        display: grid;
        gap: clamp(2rem, 4vw, 3rem);
        width: min(100%, 62rem);
      }

      .error-404__title-group {
        display: grid;
        gap: 0.75rem;
        align-items: start;
      }

      .error-404__title-group h1 {
        margin: 0;
        font-family: var(--font-family-sans);
        font-size: clamp(5.75rem, 12vw, 8rem);
        font-weight: 880;
        line-height: 0.92;
        letter-spacing: -0.06em;
        color: var(--foreground);
      }

      .error-404__title-group p {
        margin: 0;
        max-width: 24ch;
        font-family: var(--font-family-display);
        font-size: clamp(1.9rem, 4vw, 3rem);
        line-height: 1.02;
        color: transparent;
        background-image: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.98) 0%,
          color-mix(in srgb, var(--foreground) 56%, transparent) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
      }

      .error-404__actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.8rem;
      }

      .error-404__action {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.55rem;
        min-height: 3.5rem;
        padding: 0 1.25rem;
        border: 1px solid color-mix(in srgb, var(--foreground) 10%, transparent);
        border-radius: 999px;
        background: color-mix(in srgb, var(--foreground) 8%, transparent);
        color: var(--foreground);
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.18);
        text-decoration: none;
        transition:
          transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
          background-color 0.22s ease,
          border-color 0.22s ease,
          box-shadow 0.22s ease;
        cursor: pointer;
      }

      .error-404__action:hover {
        background: color-mix(in srgb, var(--foreground) 12%, transparent);
        border-color: color-mix(in srgb, var(--foreground) 16%, transparent);
        box-shadow: 0 14px 30px rgba(0, 0, 0, 0.24);
      }

      .error-404__action:active {
        transform: scale(0.98);
      }

      .error-404__action--icon {
        width: 3.5rem;
        padding: 0;
      }

      .error-404__action svg {
        width: 22px;
        height: 22px;
        flex: 0 0 auto;
      }

      @media (max-width: 768px) {
        .error-404 {
          align-items: flex-start;
          padding-top: 7.5rem;
        }

        .error-404__content {
          gap: 2rem;
        }

        .error-404__title-group {
          gap: 0.65rem;
        }

        .error-404__title-group p {
          max-width: 14ch;
        }

        .error-404__actions {
          gap: 0.7rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <div class="page__bg" aria-hidden="true">
        <div class="hero__grid"></div>
        <div class="hero__glow"></div>
        <div class="hero__vignette"></div>
      </div>
      <main class="site-main">
        <section class="error-404" aria-labelledby="error-offline-title">
          <div class="error-404__glow" aria-hidden="true"></div>
          <div class="error-404__content">
            <div class="error-404__title-group">
              <h1 id="error-offline-title">OFFLINE</h1>
              <p>当前网络不可用，已访问过的页面可能仍可离线打开。</p>
            </div>
            <div class="error-404__actions">
              <button
                type="button"
                class="error-404__action error-404__action--icon"
                onclick="window.history.back()"
                aria-label="返回上一页"
              >
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M228,128a12,12,0,0,1-12,12H69l51.52,51.51a12,12,0,0,1-17,17l-72-72a12,12,0,0,1,0-17l72-72a12,12,0,0,1,17,17L69,116H216A12,12,0,0,1,228,128Z"
                  ></path>
                </svg>
              </button>
              <button
                type="button"
                class="error-404__action"
                onclick="window.location.reload()"
              >
                <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true">
                  <path
                    d="M244,56v48a12,12,0,0,1-12,12H184a12,12,0,1,1,0-24H201.1l-19-17.38c-.13-.12-.26-.24-.38-.37A76,76,0,1,0,127,204h1a75.53,75.53,0,0,0,52.15-20.72,12,12,0,0,1,16.49,17.45A99.45,99.45,0,0,1,128,228h-1.37A100,100,0,1,1,198.51,57.06L220,76.72V56a12,12,0,0,1,24,0Z"
                  ></path>
                </svg>
                <span>重新连接</span>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
